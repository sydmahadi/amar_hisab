
name: Build Amar Hisab APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      # Generate a fresh Android project because the workflow
      # rebuilds the Android folder from scratch.
      - name: Generate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sydmahadi .

      # Set compileSdk to 36 in the generated Gradle file.
      - name: Configure Android compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next(
              (p for p in candidates if p.exists()),
              None
          )

          if gradle_file is None:
              raise SystemExit(
                  "ERROR: Android app Gradle file not found."
              )

          content = gradle_file.read_text()

          if gradle_file.name.endswith(".kts"):
              pattern = r"compileSdk\s*=\s*[^\n]+"
              replacement = "compileSdk = 36"
          else:
              pattern = r"compileSdkVersion\s+[^\n]+"
              replacement = "compileSdkVersion 36"

          updated, count = re.subn(
              pattern,
              replacement,
              content,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: Could not find compileSdk setting in "
                  + str(gradle_file)
              )

          gradle_file.write_text(updated)

          print("Updated:", gradle_file)
          print("compileSdk set to 36")
          print(
              "\n".join(
                  line for line in updated.splitlines()
                  if "compileSdk" in line
              )
          )
          PY

      - name: Enable AndroidX
        run: |
          touch android/gradle.properties

          if ! grep -q '^android.useAndroidX=' android/gradle.properties; then
            echo 'android.useAndroidX=true' >> android/gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=' android/gradle.properties; then
            echo 'android.enableJetifier=true' >> android/gradle.properties
          fi

      - name: Verify Android configuration
        run: |
          grep -n 'compileSdk' android/app/build.gradle*
          cat android/gradle.properties

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
