name: Build Amar Hisab APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sydmahadi .

      - name: Configure Android compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle = next(
              (p for p in candidates if p.exists()),
              None
          )

          if gradle is None:
              raise SystemExit(
                  "ERROR: Android app Gradle file not found."
              )

          content = gradle.read_text()

          if gradle.name.endswith(".kts"):
              patterns = [
                  (
                      r"compileSdk\s*=\s*[^\n]+",
                      "compileSdk = 36"
                  ),
                  (
                      r"compileSdk\s+[^\n]+",
                      "compileSdk = 36"
                  ),
              ]
          else:
              patterns = [
                  (
                      r"compileSdkVersion\s+[^\n]+",
                      "compileSdkVersion 36"
                  ),
                  (
                      r"compileSdk\s*=\s*[^\n]+",
                      "compileSdk = 36"
                  ),
              ]

          changed = False

          for pattern, replacement in patterns:
              updated, count = re.subn(
                  pattern,
                  replacement,
                  content,
                  count=1
              )

              if count > 0:
                  content = updated
                  changed = True
                  break

          if not changed:
              raise SystemExit(
                  "ERROR: Could not find compileSdk in "
                  + str(gradle)
              )

          gradle.write_text(content)

          print("Updated:", gradle)

          for line in content.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

      - name: Patch gallery_saver_plus Android compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pub_cache = (
              Path.home()
              / ".pub-cache"
              / "hosted"
              / "pub.dev"
          )

          files = []

          files.extend(
              pub_cache.glob(
                  "gallery_saver_plus-*/android/build.gradle"
              )
          )

          files.extend(
              pub_cache.glob(
                  "gallery_saver_plus-*/android/build.gradle.kts"
              )
          )

          if not files:
              raise SystemExit(
                  "ERROR: gallery_saver_plus Gradle file not found."
              )

          for gradle in files:
              content = gradle.read_text()

              original = content

              replacements = [
                  (
                      r"compileSdkVersion\s+31\b",
                      "compileSdkVersion 36"
                  ),
                  (
                      r"compileSdkVersion\s+32\b",
                      "compileSdkVersion 36"
                  ),
                  (
                      r"compileSdkVersion\s+33\b",
                      "compileSdkVersion 36"
                  ),
                  (
                      r"compileSdkVersion\s+34\b",
                      "compileSdkVersion 36"
                  ),
                  (
                      r"compileSdkVersion\s+35\b",
                      "compileSdkVersion 36"
                  ),
                  (
                      r"compileSdk\s*=\s*31\b",
                      "compileSdk = 36"
                  ),
                  (
                      r"compileSdk\s*=\s*32\b",
                      "compileSdk = 36"
                  ),
                  (
                      r"compileSdk\s*=\s*33\b",
                      "compileSdk = 36"
                  ),
                  (
                      r"compileSdk\s*=\s*34\b",
                      "compileSdk = 36"
                  ),
                  (
                      r"compileSdk\s*=\s*35\b",
                      "compileSdk = 36"
                  ),
                  (
                      r"compileSdk\s+31\b",
                      "compileSdk 36"
                  ),
              ]

              for pattern, replacement in replacements:
                  content = re.sub(
                      pattern,
                      replacement,
                      content
                  )

              if content == original:
                  print(
                      "WARNING: No compileSdk replacement "
                      "was needed in:",
                      gradle
                  )
              else:
                  gradle.write_text(content)
                  print("Patched:", gradle)

              print("Relevant Gradle lines:")

              for line in content.splitlines():
                  if (
                      "compileSdk" in line
                      or "compileSdkVersion" in line
                  ):
                      print(line)
          PY

      - name: Enable AndroidX
        run: |
          touch android/gradle.properties

          if ! grep -q '^android.useAndroidX=' android/gradle.properties; then
            echo 'android.useAndroidX=true' >> android/gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=' android/gradle.properties; then
            echo 'android.enableJetifier=true' >> android/gradle.properties
          fi

      - name: Verify Android configuration
        run: |
          echo "========================================"
          echo "APP GRADLE"
          echo "========================================"

          grep -n "compileSdk" android/app/build.gradle* || true

          echo "========================================"
          echo "GALLERY SAVER PLUS GRADLE"
          echo "========================================"

          grep -n "compileSdk" \
            "$HOME"/.pub-cache/hosted/pub.dev/gallery_saver_plus-*/android/build.gradle* \
            || true

          echo "========================================"
          echo "ANDROID PROPERTIES"
          echo "========================================"

          cat android/gradle.properties

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
