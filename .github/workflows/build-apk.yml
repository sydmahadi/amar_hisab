name: Build Amar Hisab APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Generate Android Project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --org com.amar \
            --project-name amar_hisab \
            .

      - name: Configure Android Build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # Android app Gradle file
          # ---------------------------------------------------------
          gradle_files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          gradle_file = None

          for file in gradle_files:
              if file.exists():
                  gradle_file = file
                  break

          if gradle_file is None:
              raise SystemExit(
                  "ERROR: Android app Gradle file was not found."
              )

          text = gradle_file.read_text(encoding="utf-8")

          # Flutter generated projects normally use:
          #
          # compileSdk = flutter.compileSdkVersion
          #
          # or:
          #
          # compileSdk flutter.compileSdkVersion
          #
          # Force compileSdk 36 so gallery_saver_plus and
          # its AndroidX dependencies can compile correctly.

          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36",
          )

          text = text.replace(
              "compileSdk flutter.compileSdkVersion",
              "compileSdk 36",
          )

          gradle_file.write_text(
              text,
              encoding="utf-8",
          )

          print(
              f"Updated compileSdk to 36 in: {gradle_file}"
          )

          # ---------------------------------------------------------
          # Android Gradle properties
          # ---------------------------------------------------------
          properties = Path(
              "android/gradle.properties"
          )

          if properties.exists():
              props = properties.read_text(
                  encoding="utf-8"
              )

              if "android.useAndroidX=true" not in props:
                  props += (
                      "\nandroid.useAndroidX=true\n"
                  )

              if "android.enableJetifier=true" not in props:
                  props += (
                      "android.enableJetifier=true\n"
                  )

              properties.write_text(
                  props,
                  encoding="utf-8",
              )

          # ---------------------------------------------------------
          # Print final configuration for debugging
          # ---------------------------------------------------------
          print("\n===== Final Android Gradle Configuration =====")
          print(
              gradle_file.read_text(
                  encoding="utf-8"
              )
          )
          print(
              "==============================================\n"
          )
          PY

      - name: Set App Name and Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              'android:label="amar_hisab"',
              'android:label="আমার হিসাব"'
          )

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n\n'
                  '    <uses-permission android:name="android.permission.INTERNET"/>'
              )

          manifest.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Check Android Structure
        run: |
          echo "===== Android Project Structure ====="
          find android -maxdepth 7 -type f | sort

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
