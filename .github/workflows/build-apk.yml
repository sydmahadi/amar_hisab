
name: Build Amar Hisab APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sydmahadi .

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36"

      - name: Fix app compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle = next(
              (p for p in candidates if p.exists()),
              None
          )

          if gradle is None:
              raise SystemExit("App Gradle file not found")

          content = gradle.read_text()

          if gradle.name.endswith(".kts"):
              pattern = r"compileSdk\s*=\s*[^\n]+"
              replacement = "compileSdk = 36"
          else:
              pattern = r"compileSdkVersion\s+[^\n]+"
              replacement = "compileSdkVersion 36"

          updated, count = re.subn(
              pattern, replacement, content, count=1
          )

          if count == 0:
              raise SystemExit("Could not update app compileSdk")

          gradle.write_text(updated)
          print(f"{gradle}: compileSdk 36")
          PY

      - name: Fix gallery_saver_plus compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          matches = list(
              cache.glob(
                  "gallery_saver_plus-*/android/build.gradle"
              )
          ) + list(
              cache.glob(
                  "gallery_saver_plus-*/android/build.gradle.kts"
              )
          )

          if not matches:
              raise SystemExit(
                  "gallery_saver_plus Android Gradle file not found"
              )

          for gradle in matches:
              content = gradle.read_text()

              patterns = [
                  (
                      r"compileSdkVersion\s+31\b",
                      "compileSdkVersion 36"
                  ),
                  (
                      r"compileSdk\s*=\s*31\b",
                      "compileSdk = 36"
                  ),
                  (
                      r"compileSdk\s+31\b",
                      "compileSdk 36"
                  ),
              ]

              changed = False

              for pattern, replacement in patterns:
                  content, count = re.subn(
                      pattern, replacement, content
                  )
                  if count:
                      changed = True

              if not changed:
                  print("No API 31 setting found in", gradle)
                  print(content)
                  raise SystemExit(
                      "Could not patch gallery_saver_plus compileSdk"
                  )

              gradle.write_text(content)
              print("Patched:", gradle)

          PY

      - name: Enable AndroidX
        run: |
          touch android/gradle.properties

          grep -q '^android.useAndroidX=' android/gradle.properties \
            || echo 'android.useAndroidX=true' >> android/gradle.properties

          grep -q '^android.enableJetifier=' android/gradle.properties \
            || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Verify Android SDK configuration
        run: |
          echo "App compileSdk:"
          grep -n 'compileSdk' android/app/build.gradle*

          echo "gallery_saver_plus compileSdk:"
          grep -n 'compileSdk' \
            "$HOME"/.pub-cache/hosted/pub.dev/gallery_saver_plus-*/android/build.gradle*

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
